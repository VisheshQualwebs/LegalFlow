<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LegalFlow - Add Client</title>
    <link rel="icon" type="image/png" href="../assets/image/logo.png">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-gray-100">

    <nav class="bg-black text-white shadow-lg">
        <div class="max-w-7xl mx-auto flex justify-between items-center px-8 py-4">

            <h1 class="text-3xl font-bold">LegalFlow</h1>

            <ul class="flex gap-8">
                <li><a href="Home.html" class="hover:text-gray-400">Home</a></li>
                <li><a href="Clients.html" class="text-gray-300">Clients</a></li>
                <li><a href="Cases.html" class="hover:text-gray-400">Cases</a></li>
                <li><a href="Documents.html" class="hover:text-gray-400">Documents</a></li>
                <li><a href="Profile.html" class="hover:text-gray-400">Profile</a></li>
            </ul>

            <a id="logoutButton" href="#" class="bg-white text-black px-5 py-2 rounded-lg font-semibold hover:bg-gray-200">
                Logout
            </a>

        </div>
    </nav>

    <div class="max-w-4xl mx-auto mt-10 mb-10">

        <div class="bg-white rounded-xl shadow-lg p-8">
            <h2 class="text-3xl font-bold mb-8 text-center">
                Add New Client
            </h2>

            <form id="clientForm">
                <div class="grid grid-cols-2 gap-6">
                    <div>
                        <label class="font-semibold">Full Name</label>
                        <input type="text" required id="fullName"
                            class="w-full mt-2 border rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-black">
                    </div>

                    <div>
                        <label class="font-semibold">Phone Number</label>
                        <input type="tel" required id="phone"
                            class="w-full mt-2 border rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-black">
                    </div>

                    <div>
                        <label class="font-semibold">Email</label>
                        <input type="email" required id="email"
                            class="w-full mt-2 border rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-black">
                    </div>

                    <div>
                        <label class="font-semibold">Occupation</label>
                        <input type="text" id="occupation"
                            class="w-full mt-2 border rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-black">
                    </div>

                    <div class="col-span-2">
                        <label class="font-semibold">Address</label>
                        <textarea rows="3" id="address"
                            class="w-full mt-2 border rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-black"></textarea>
                    </div>

                    <div>
                        <label class="font-semibold">City</label>
                        <input type="text" id="city"
                            class="w-full mt-2 border rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-black">
                    </div>

                    <div>
                        <label class="font-semibold">State</label>
                        <input type="text" id="state"
                            class="w-full mt-2 border rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-black">
                    </div>

                    <div>
                        <label class="font-semibold">PIN Code</label>
                        <input type="text" id="pinCode"
                            class="w-full mt-2 border rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-black">
                    </div>

                    <div>
                        <label class="font-semibold">Gender</label>
                        <select id="gender"
                            class="w-full mt-2 border rounded-lg p-3 focus:outline-none focus:ring-2 focus:ring-black">
                            <option>Select</option>
                            <option>Male</option>
                            <option>Female</option>
                            <option>Other</option>
                        </select>
                    </div>
                </div>

                <div class="flex justify-end gap-4 mt-10">
                    <a href="Clients.html"
                        class="bg-gray-300 px-6 py-3 rounded-lg hover:bg-gray-400">
                        Cancel
                    </a>

                    <button type="submit"
                        class="bg-black text-white px-6 py-3 rounded-lg hover:bg-gray-800">
                        Save Client
                    </button>
                </div>
            </form>
        </div>

    </div>
<script src="../assets/js/addClient.js"></script>
</body>

</html>
