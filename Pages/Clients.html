<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LegalFlow - Clients</title>

    <link rel="icon" type="image/png" href="../assets/image/logo.png">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-gray-100">

    <nav class="bg-black text-white shadow-lg">
        <div class="max-w-7xl mx-auto flex items-center justify-between px-8 py-4">
            <h1 class="text-3xl font-bold">LegalFlow</h1>

            <ul class="flex gap-8 font-medium">
                <li><a href="Home.html" class="hover:text-gray-400">Home</a></li>
                <li><a href="Clients.html" class="text-gray-300">Clients</a></li>
                <li><a href="Cases.html" class="hover:text-gray-400">Cases</a></li>
                <li><a href="Documents.html" class="hover:text-gray-400">Documents</a></li>
                <li><a href="Profile.html" class="hover:text-gray-400">Profile</a></li>
            </ul>

            <a id="logoutButton" href="#"
                class="bg-white text-black px-5 py-2 rounded-lg font-semibold hover:bg-gray-200">
                Logout
            </a>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto px-8 mt-10 flex justify-between items-center">
        <h2 class="text-4xl font-bold">Clients</h2>
        <a href="AddClient.html" class="bg-black text-white px-5 py-3 rounded-lg hover:bg-gray-800">
            + Add Client
        </a>
    </div>

    <div class="max-w-7xl mx-auto px-8 mt-6">
        <input type="text" placeholder="Search client..."
            class="w-full p-3 rounded-lg border border-gray-400 bg-white focus:outline-none focus:ring-2 focus:ring-black">
    </div>

    <div class="max-w-7xl mx-auto px-8 mt-8 mb-10">
        <div class="bg-white rounded-xl shadow-lg overflow-hidden">
            <table class="w-full">
                <thead class="bg-black text-white">
                    <tr>
                        <th class="p-4 text-left">Client ID</th>
                        <th class="p-4 text-left">Name</th>
                        <th class="p-4 text-left">Phone</th>
                        <th class="p-4 text-left">Email</th>
                        <th class="p-4 text-center">Actions</th>
                    </tr>
                </thead>
                <tbody id="clientTableBody">
                </tbody>
            </table>
        </div>
    </div>
    <script src="../assets/js/client.js"></script>
</body>

</html>
