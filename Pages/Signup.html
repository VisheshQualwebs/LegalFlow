<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LegalFlow</title>
    <link rel="icon" type="image/png" href="image/logo.png">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body class="bg-gray-200 min-h-screen flex items-center justify-center">

    <div class="w-[1200px] h-[750px] rounded-[30px] overflow-hidden shadow-2xl border border-gray-400 grid grid-cols-2">

        <div class="bg-white flex flex-col items-center justify-center px-16">

            <img src="image/left-side.jpeg" class="w-96 mb-8" alt="Illustration">

            <h1 class="text-5xl font-bold text-black mb-6">
                Welcome!
            </h1>

            <p class="text-center text-gray-600 text-lg leading-8 max-w-md">
                Optimize legal operations with our comprehensive platform,
                empowering you to automate document creation, efficiently
                manage contracts, and mitigate risk, all in one streamlined
                solution.
            </p>

        </div>

        <div class="bg-black text-white flex items-center justify-center">

            <div class="w-[430px] py-6">

                <h2 class="text-5xl font-bold text-center mb-5 mt-5">
                    LegalFlow
                </h2>

                <h3 class="text-3xl font-semibold text-center mb-2">
                    SignUp
                </h3>

                <p class="text-center text-gray-400 mb-5">
                    Welcome Please enter your details
                </p>

                <input type="name" placeholder="Full Name"
                    class="w-full bg-transparent border border-gray-500 rounded-lg py-3 px-5 mb-5 text-white placeholder:text-gray-500 focus:outline-none focus:border-white">

                <input type="phone" placeholder="Phone Number"
                    class="w-full bg-transparent border border-gray-500 rounded-lg py-3 px-5 mb-5 text-white placeholder:text-gray-500 focus:outline-none focus:border-white">

                <input type="email" placeholder="Email"
                    class="w-full bg-transparent border border-gray-500 rounded-lg py-3 px-5 mb-5 text-white placeholder:text-gray-500 focus:outline-none focus:border-white">

                <input type="password" placeholder="Password"
                    class="w-full bg-transparent border border-gray-500 rounded-lg py-3 px-5 mb-5 text-white placeholder:text-gray-500 focus:outline-none focus:border-white">

                <input type="cpassword" placeholder="Confirm Password"
                    class="w-full bg-transparent border border-gray-500 rounded-lg py-3 px-5 mb-5 text-white placeholder:text-gray-500 focus:outline-none focus:border-white">

                <button class="w-full bg-white text-black font-semibold py-3 rounded-lg hover:bg-gray-300 transition">
                    Signup
                </button>

                <button
                    class="w-full border border-gray-500 rounded-lg py-3 mt-5 flex items-center justify-center gap-3 hover:bg-gray-900 transition">

                    <img src="image/google.png" class="w-6">

                    <span>Sign in with Google</span>

                </button>

                <p class="text-center mt-5 text-gray-400">
                    Already have an account?
                    <a href="Login.html" class="text-white font-medium underline">
                        Login
                    </a>
                </p>

            </div>

        </div>

    </div>

</body>

</html>
